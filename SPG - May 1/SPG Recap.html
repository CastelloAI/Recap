<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SPG · Recap</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />

<style>
  /* ---- Design-system tokens (subset, scoped to this page) ---- */
  :root{
    --paper:#FBFAF7; --paper-2:#F4F2ED; --paper-3:#ECEAE3;
    --ink:#141414; --ink-2:#3B3A37; --ink-3:#6B6A65; --ink-4:#A4A29C;
    --line:#E4E1D9; --line-strong:#CFCBC0;
    --coral-50:#FFF1EC; --coral-100:#FFDFD3; --coral-300:#FF9E82; --coral-400:#FF7A57; --coral-500:#F25A37; --coral-600:#D6411F;
    --iris-400:#7B71F5;

    /* SPG-specific palette: a mall blueprint feel.
       The page picks deep retail navy as the structural ink instead of pure black.
       Coral stays as the "signal" dot — taps, key figures, the one stat that pops. */
    --brand-ink:   #1B2433;        /* deep retail navy — blueprint ink */
    --brand-ink-2: #2C3648;
    --brand-paper: #F6F2EA;        /* slightly warmer than DS paper — old plan paper */
    --brand-paper-2:#EFE9DD;
    --brand-line:  #D8D2C4;
    --brand-rule:  #B7B0A0;
    --signal:      var(--coral-400);
    --signal-deep: var(--coral-600);

    /* biggest_costs supplied colors */
    --c-prop:  #4F86C6;
    --c-dep:   #F4845F;
    --c-int:   #6DBF67;
    --c-ga:    #A78BFA;
    --c-tax:   #FBBF24;

    --font-display:'Instrument Serif','Times New Roman',serif;
    --font-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:'Geist Mono','SF Mono',ui-monospace,Menlo,monospace;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#0a0a0a; }
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* The page itself is the design — sized for mobile, centered on a dark backdrop
     so on desktop it reads as the artifact rather than the canvas. */
  .stage{
    min-height:100vh;
    display:flex; justify-content:center;
    background:
      radial-gradient(1200px 600px at 50% 0%, #1a1a1a, #0a0a0a 70%);
  }
  .device{
    width:100%;
    max-width:414px;
    background:var(--brand-paper);
    color:var(--ink);
    overflow:hidden;
    position:relative;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6);
  }

  /* Persistent chrome */
  .chrome{
    position:sticky; top:0; z-index:50;
    backdrop-filter:saturate(1.2) blur(14px);
    -webkit-backdrop-filter:saturate(1.2) blur(14px);
    background:rgba(246,242,234,0.78);
    border-bottom:1px solid rgba(184,176,160,0.35);
  }
  .chrome-row{
    display:flex; align-items:center; gap:10px;
    padding:14px 20px 10px;
  }
  .chrome .tick{
    font-family:var(--font-mono); font-weight:500; font-size:13px;
    color:var(--brand-ink); letter-spacing:0.04em;
  }
  .chrome .dot{ width:6px; height:6px; border-radius:50%; background:var(--signal); }
  .chrome .name{
    font-family:var(--font-sans); font-weight:500; font-size:13px;
    color:var(--ink-2);
  }
  .chrome .recap{
    margin-left:auto;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-3);
  }
  .chrome-progress{
    height:1.5px; width:100%; background:rgba(184,176,160,0.25);
    position:relative;
  }
  .chrome-progress > i{
    display:block; height:100%;
    background:linear-gradient(90deg, var(--signal), var(--signal-deep));
    width:var(--p,0%);
    transition:width 60ms linear;
  }

  /* Section bones — no boxy cards. Bands of color, no hairlines. */
  section{ position:relative; padding:0 20px; }
  .band{ padding:64px 20px; }
  .band-tight{ padding:40px 20px; }
  .band-paper{ background:var(--brand-paper); }
  .band-paper-2{ background:var(--brand-paper-2); }
  .band-ink{ background:var(--brand-ink); color:var(--brand-paper); }
  .band-ink p{ color:rgba(246,242,234,0.78); }

  .eyebrow{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.16em;
    text-transform:uppercase; font-weight:500;
    color:var(--ink-3);
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .sig{ color:var(--signal-deep); }
  .eyebrow .bar{ width:18px; height:1px; background:var(--brand-rule); }

  .display{
    font-family:var(--font-display); font-weight:400;
    line-height:0.95; letter-spacing:-0.02em;
    color:var(--brand-ink);
  }
  .display em, .ital{ font-style:italic; }
  .signal{ color:var(--signal-deep); }

  p.lede{
    font-family:var(--font-sans); font-size:15px; line-height:1.55;
    color:var(--ink-2); margin:0;
  }
  p.lede em{ font-family:var(--font-display); font-style:italic; color:var(--brand-ink); font-size:17px; }
  p.lede em.signal{ color:var(--signal-deep); }

  /* Reset beats: italic-serif on contrasting band */
  .reset{
    background:var(--brand-paper-2);
    padding:44px 28px;
    border-top:1px solid var(--brand-line);
    border-bottom:1px solid var(--brand-line);
  }
  .reset .text{
    font-family:var(--font-display); font-style:italic;
    font-size:23px; line-height:1.25; color:var(--brand-ink);
    letter-spacing:-0.005em;
  }
  .reset .text .signal{ color:var(--signal-deep); font-style:italic; }

  /* mono labels */
  .mono{ font-family:var(--font-mono); }
  .small{ font-size:12px; line-height:1.45; color:var(--ink-3); }

  /* Page bottom safe area */
  .pad-bottom{ height:48px; }

  /* The watermark plan grid that washes through "blueprint" sections */
  .plan-grid{
    position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(27,36,51,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,36,51,0.07) 1px, transparent 1px);
    background-size: 24px 24px;
    mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
  }

  /* numerals nicely tabular for stat blocks */
  .tnum{ font-variant-numeric: tabular-nums; }

  /* tap-to-deepen affordance */
  .tap{
    cursor:pointer; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .tap-hint{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--ink-4);
  }

  /* Reduce default margins for headings inside sections */
  h1,h2,h3,h4{ margin:0; }

  /* Subtle paper grain for the warm "old plan" feel */
  .grain::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image: radial-gradient(rgba(27,36,51,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode:multiply; opacity:0.5;
  }

  /* utility */
  .col{ display:flex; flex-direction:column; }
  .row{ display:flex; flex-direction:row; }
  .gap-1{ gap:4px; } .gap-2{ gap:8px; } .gap-3{ gap:12px; } .gap-4{ gap:16px; } .gap-5{ gap:24px; } .gap-6{ gap:32px; }
  .between{ justify-content:space-between; }
  .center{ align-items:center; }

  /* No scrollbar fluff in the device viewport on desktop */
  .device::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div class="stage">
  <main id="device" class="device">
    <!-- Persistent orientation chrome -->
    <header class="chrome" role="banner">
      <div class="chrome-row">
        <span class="dot" aria-hidden="true"></span>
        <span class="tick">SPG</span>
        <span class="name">Simon Property Group</span>
        <span class="recap">Recap · FY '23</span>
      </div>
      <div class="chrome-progress" aria-hidden="true"><i id="progress"></i></div>
    </header>

    <div id="root"></div>
  </main>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="business.jsx"></script>
<script type="text/babel" src="costs.jsx"></script>
<script type="text/babel" src="weight.jsx"></script>
<script type="text/babel" src="footprint.jsx"></script>
<script type="text/babel" src="bet.jsx"></script>
<script type="text/babel" src="competition.jsx"></script>
<script type="text/babel" src="close.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // Track scroll progress against the page (the page itself is the scroller on mobile;
  // on desktop the device div is centered with body-scroll, same effect).
  (function(){
    const bar = document.getElementById('progress');
    function update(){
      const h = document.documentElement;
      const top = h.scrollTop || document.body.scrollTop || window.scrollY;
      const max = h.scrollHeight - h.clientHeight;
      const p = max > 0 ? (top / max) * 100 : 0;
      bar.style.setProperty('--p', p.toFixed(2)+'%');
    }
    window.addEventListener('scroll', update, { passive:true });
    window.addEventListener('resize', update);
    update();
  })();
</script>
</body>
</html>
