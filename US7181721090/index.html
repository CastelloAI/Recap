<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PM · Recap FY '25</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* ----- Page-level overrides ----- */
  :root {
    /* PMI palette: warm paper, deeper ink, signal ember */
    --paper:        #F4EFE6;     /* warm pack-paper / cigarette paper */
    --paper-2:      #ECE5D7;
    --paper-3:      #E2DAC8;
    --ink:          #15110C;     /* tobacco-leaf ink */
    --ink-2:        #3A332A;
    --ink-3:        #6B6358;
    --ink-4:        #A39A8C;
    --line:         #D9D1BF;
    --line-strong:  #BFB5A0;

    /* Signal ember — smolder coral */
    --ember:        #E04A1F;
    --ember-soft:   #F58A66;
    --ember-bg:     #F8E2D6;

    /* Cool pivot color — smoke-free indicator */
    --pivot:        #2E7C8F;     /* IQOS / heated-tobacco teal */
    --pivot-soft:   #B8D6DD;
    --pivot-bg:     #DCEAEE;

    --fg:           var(--ink);
    --fg-muted:     var(--ink-2);
    --fg-subtle:    var(--ink-3);
    --bg:           var(--paper);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #2A2622;
    font-family: var(--font-sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  /* The mobile artifact itself */
  #app {
    width: 100%;
    max-width: 430px;
    background: var(--paper);
    position: relative;
    overflow-x: clip;
    box-shadow: 0 0 80px rgba(0,0,0,0.35);
  }

  /* ---------- STICKY CHROME ---------- */
  .chrome {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(244, 239, 230, 0.78);
    -webkit-backdrop-filter: saturate(1.4) blur(18px);
    backdrop-filter: saturate(1.4) blur(18px);
    border-bottom: 1px solid rgba(217, 209, 191, 0.5);
  }
  .chrome-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px 20px;
  }
  .chrome-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .chrome-ticker {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .chrome-name {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.01em;
  }
  .chrome-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .chrome-progress {
    height: 1.5px;
    background: transparent;
    position: relative;
  }
  .chrome-progress-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--ember);
    transform-origin: left center;
    will-change: transform;
  }

  /* ---------- TYPE PRIMITIVES ---------- */
  .display {
    font-family: var(--font-display);
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .display em, .it { font-style: italic; }
  .signal { color: var(--ember); }
  .pivot-c { color: var(--pivot); }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .eyebrow .dot {
    color: var(--ember);
    margin: 0 6px;
  }

  .body-copy {
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink-2);
    text-wrap: pretty;
  }
  .body-copy em { font-family: var(--font-display); font-style: italic; font-size: 1.08em; }

  /* ---------- SECTION SCAFFOLDING ---------- */
  section {
    position: relative;
    padding: 56px 24px;
  }
  section.tight { padding: 36px 24px; }
  section.tonal { background: var(--paper-2); }
  section.dark {
    background: #15110C;
    color: #F4EFE6;
  }
  section.dark .body-copy { color: #C9C0B0; }
  section.dark .display { color: #F4EFE6; }
  section.dark .eyebrow { color: #908576; }
  section.ember-band {
    background: linear-gradient(180deg, var(--paper) 0%, var(--ember-bg) 50%, var(--paper) 100%);
  }

  /* Reset beats */
  .reset-beat {
    padding: 48px 28px;
    background: var(--paper-3);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .reset-beat .text {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    line-height: 1.32;
    color: var(--ink);
    text-wrap: balance;
  }
  .reset-beat .text .signal { font-style: italic; }
  .reset-beat .mark {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-3);
    margin-bottom: 14px;
    display: block;
  }

  /* ---------- HERO ---------- */
  .hero {
    padding: 24px 24px 64px 24px;
    position: relative;
    overflow: hidden;
  }
  .hero-thesis {
    font-family: var(--font-display);
    font-size: 56px;
    line-height: 0.94;
    letter-spacing: -0.025em;
    margin-top: 28px;
  }
  .hero-thesis .l1 { display: block; }
  .hero-thesis .l2 { display: block; font-style: italic; color: var(--ink-2); }
  .hero-thesis .l3 { display: block; }
  .hero-thesis .ember { color: var(--ember); }

  .hero-sub {
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-2);
    margin-top: 28px;
    max-width: 32ch;
  }
  .hero-sub em { font-family: var(--font-display); font-style: italic; font-size: 1.1em; }

  .hero-meta {
    display: flex;
    gap: 18px;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .hero-meta .cell { display: flex; flex-direction: column; gap: 4px; }
  .hero-meta .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  .hero-meta .v { font-family: var(--font-display); font-size: 24px; line-height: 1; color: var(--ink); }

  /* Smoke layers in hero */
  .smoke-canvas {
    position: absolute;
    top: 60px;
    right: -40px;
    width: 320px;
    height: 320px;
    pointer-events: none;
    opacity: 0.5;
  }

  /* ---------- TWO ENGINES (combustible vs smoke-free) ---------- */
  .engines {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 40px;
  }
  .engine {
    position: relative;
    padding: 22px 22px 26px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .engine.comb {
    background: linear-gradient(180deg, #f1e7d4 0%, #e9dcc1 100%);
  }
  .engine.sf {
    background: linear-gradient(180deg, #dde8eb 0%, #c6dde2 100%);
  }
  .engine .label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .engine .name {
    font-family: var(--font-display);
    font-size: 32px;
    line-height: 1;
    margin-top: 6px;
    color: var(--ink);
  }
  .engine .name em { font-style: italic; }
  .engine .figure {
    font-family: var(--font-display);
    font-size: 64px;
    line-height: 0.9;
    margin-top: 18px;
    color: var(--ink);
  }
  .engine .figure .unit {
    font-size: 22px;
    color: var(--ink-3);
    margin-left: 4px;
  }
  .engine .pct-bar {
    margin-top: 14px;
    height: 4px;
    background: rgba(0,0,0,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .engine .pct-fill {
    height: 100%;
    border-radius: 4px;
    transform-origin: left;
  }
  .engine.comb .pct-fill { background: var(--ember); }
  .engine.sf .pct-fill { background: var(--pivot); }
  .engine .growth {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-2);
  }
  .engine .growth .arrow {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
  }
  .engine.comb .growth .arrow { color: var(--ember); }
  .engine.sf .growth .arrow { color: var(--pivot); }

  /* The "smoldering" combustible viz at top */
  .cig-stage {
    position: relative;
    height: 80px;
    margin: 16px -22px 0;
  }
  .vape-stage {
    position: relative;
    height: 80px;
    margin: 16px -22px 0;
  }

  /* ---------- THE SCALE ---------- */
  .scale-grid {
    margin-top: 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .scale-grid .cell {
    background: var(--paper);
    padding: 22px 18px;
  }
  .scale-grid .cell.full { grid-column: 1 / -1; }
  .scale-grid .k {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .scale-grid .v {
    font-family: var(--font-display);
    font-size: 44px;
    line-height: 1;
    color: var(--ink);
    margin-top: 8px;
  }
  .scale-grid .v .small { font-size: 18px; color: var(--ink-3); }
  .scale-grid .sub {
    margin-top: 8px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-3);
  }

  /* ---------- COSTS DONUT ---------- */
  .donut-wrap {
    position: relative;
    margin: 28px auto 0;
    width: 320px;
    max-width: 100%;
  }
  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }
  .donut-center .k {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .donut-center .v {
    font-family: var(--font-display);
    font-size: 44px;
    line-height: 1;
    margin-top: 4px;
  }
  .donut-center .v em { font-style: italic; color: var(--ember); }
  .donut-center .sub {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 4px;
  }
  .donut-legend {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .donut-legend .row {
    background: var(--paper);
    padding: 14px 4px;
    display: grid;
    grid-template-columns: 14px 1fr auto;
    gap: 14px;
    align-items: center;
  }
  .donut-legend .swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  .donut-legend .label {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink);
  }
  .donut-legend .pct {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- GEOGRAPHY ---------- */
  .geo-wrap {
    margin-top: 32px;
    position: relative;
  }
  .geo-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 24px;
  }
  .geo-row {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 14px;
    align-items: start;
  }
  .geo-row .num {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ember);
    padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .geo-row .body {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .geo-row .region {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.3;
  }
  .geo-row .pct-line {
    height: 2px;
    background: var(--line);
    position: relative;
  }
  .geo-row .pct-line .fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--ember);
    transform-origin: left;
  }
  .geo-row .pct-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
  }

  /* ---------- THE BET ---------- */
  .bet-stack {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .bet-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 20px;
    border-radius: 14px;
  }
  .bet-card .k {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #908576;
  }
  .bet-card .v {
    font-family: var(--font-display);
    font-size: 36px;
    line-height: 1;
    margin-top: 10px;
    color: #F4EFE6;
  }
  .bet-card .v em { font-style: italic; color: #FF8B6A; }
  .bet-card .body {
    margin-top: 10px;
    font-family: var(--font-sans);
    font-size: 13px;
    color: #C9C0B0;
    line-height: 1.5;
  }
  .bet-card .body em { font-family: var(--font-display); font-style: italic; font-size: 1.1em; }

  /* ---------- COMPETITORS ---------- */
  .comp-list {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .comp-row {
    background: var(--paper);
    padding: 18px 4px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: background 200ms;
  }
  .comp-row:hover { background: var(--paper-2); }
  .comp-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .comp-name {
    font-family: var(--font-display);
    font-size: 24px;
    line-height: 1;
    color: var(--ink);
  }
  .comp-name em { font-style: italic; }
  .comp-ticker {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
  }
  .comp-bar-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .comp-bar {
    height: 6px;
    background: var(--paper-3);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }
  .comp-bar .fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--ink-3);
    transform-origin: left;
  }
  .comp-bar.pmi .fill { background: var(--ember); }
  .comp-cap {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .comp-detail {
    overflow: hidden;
  }
  .comp-detail-inner {
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    margin-top: 4px;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .comp-stats {
    margin-top: 10px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .comp-stats .stat {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .comp-stats .stat b {
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--ink);
  }
  .comp-tap-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    text-transform: uppercase;
  }

  /* ---------- TAKEAWAY ---------- */
  .takeaway {
    padding: 80px 24px 100px;
    background: var(--paper);
  }
  .takeaway .display {
    font-size: 46px;
    line-height: 1;
  }
  .penny-grid {
    margin: 32px 0 28px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
  }
  .penny-grid .p {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--line);
    transition: background 280ms var(--ease-out);
  }
  .penny-grid .p.kept { background: var(--ember); }
  .penny-grid .p.div { background: var(--ink); }
  .penny-key {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
  }
  .penny-key .row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-2);
  }
  .penny-key .sw { width: 10px; height: 10px; border-radius: 50%; }

  .footer {
    padding: 32px 24px 48px;
    background: var(--ink);
    color: #908576;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.6;
  }
  .footer .top {
    color: #F4EFE6;
    font-family: var(--font-display);
    font-size: 24px;
    text-transform: none;
    letter-spacing: 0;
    font-style: italic;
    margin-bottom: 14px;
  }

  /* fade reveal */
  .fade {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }
  .fade.in {
    opacity: 1;
    transform: none;
  }

  @media (max-width: 360px) {
    .hero-thesis { font-size: 48px; }
    .engine .figure { font-size: 54px; }
    .takeaway .display { font-size: 38px; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="scenes.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
